apply plugin: 'com.android.application'

android {
    compileSdkVersion Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)

    defaultConfig {
        applicationId 'com.tom_roush.pdfbox.sample'
        minSdkVersion 14
        targetSdkVersion Integer.parseInt(project.ANDROID_BUILD_TARGET_SDK_VERSION)
        versionName project.VERSION_NAME
        versionCode Integer.parseInt(project.VERSION_CODE)
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
    namespace 'com.tom_roush.pdfbox.sample'
}

// BouncyCastle 1.85 packaging bug: bcprov and bcutil both ship the same
// org.bouncycastle.asn1.iana.* classes, causing checkDuplicateClasses to fail.
// bcprov already contains all those classes, so we exclude bcutil from all
// configurations. bcpkix (which needs bcutil APIs) still works because bcprov
// provides the overlapping class definitions at runtime.
configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
}

dependencies {
    implementation project(':library')
//    implementation "com.tom-roush:pdfbox-android:${project.VERSION_NAME}"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Optional dependencies

    // Read JPX images
    implementation files('libs/jp2-android-1.0.3.aar')
}
